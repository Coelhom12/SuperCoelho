# Organização e chave do projeto vêm das variáveis do repositório (SONAR_ORGANIZATION / SONAR_PROJECT_KEY).
sonar.projectName=Escalas - Supermercado Coelho
sonar.sourceEncoding=UTF-8

sonar.sources=backend/src/main,frontend/src
sonar.exclusions=backend/src/main/resources/static/**,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/test/**
sonar.tests=backend/src/test,frontend/src
sonar.test.inclusions=backend/src/test/**,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/test/**

sonar.java.binaries=backend/target/classes
sonar.java.source=21
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.coverage.exclusions=frontend/src/main.tsx,frontend/src/types.ts,backend/src/main/java/**/EscalasApplication.java
